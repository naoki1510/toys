name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://toys.naoki1510.net
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      # Node は .node-version、pnpm は package.json の packageManager から読む
      - uses: naoki1510/ci-workflows/.github/actions/setup-pnpm-node@v2

      # typecheck (内部で routeTree と Cloudflare 型を生成) → test → build。
      # `pnpm build` は vite build のみで型を見ないので、typecheck を先に通す。
      - uses: naoki1510/ci-workflows/.github/actions/vite-build@v2

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
