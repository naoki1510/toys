name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# naoki1510/ci-workflows の v2 composite action を使う。
# vite-lint は `pnpm lint` / `pnpm format:check`、vite-build は `pnpm typecheck` →
# `pnpm test` → `pnpm build` を呼ぶので、package.json の script 名を変えるときは
# action の input で合わせること。
jobs:
  lint:
    name: lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Node は .node-version、pnpm は package.json の packageManager から読む
      - uses: naoki1510/ci-workflows/.github/actions/setup-pnpm-node@v2
      - uses: naoki1510/ci-workflows/.github/actions/vite-lint@v2

  build:
    name: typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: naoki1510/ci-workflows/.github/actions/setup-pnpm-node@v2
      - uses: naoki1510/ci-workflows/.github/actions/vite-build@v2
